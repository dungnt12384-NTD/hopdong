<style>

<script>
/* ===== Tiện ích ===== */
const KEY='hd-manager-v2',OLDKEY='manpower-tracker-v1',DAY=86400000;
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const vn=s=>s?s.split('-').reverse().join('-'):'';   // hiển thị ngày dd-mm-yyyy (dữ liệu lưu yyyy-mm-dd)
const vnm=ym=>ym?ym.split('-').reverse().join('-'):'';   // kỳ mm-yyyy
const vnDT=t=>{const d=new Date(t);return`${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};   // ngày giờ dd-mm-yyyy hh:mm
const fmt=n=>Math.round(+n||0).toLocaleString('vi-VN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>iso(new Date());
const refStr=()=>$('#refDate').value||today();
const refD=()=>parse(refStr());
const ymOf=s=>s.slice(0,7);
const addMonths=(d,m)=>{const r=new Date(d.getFullYear(),d.getMonth()+m,1);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(d.getDate(),last));return r};
const prevYm=ym=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-2,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');

const LBL={ok:'Đang hiệu lực',warn:'Sắp hết hạn',bad:'Đã hết hạn',wait:'Chưa hiệu lực',draft:'Dự thảo',liq:'Đã thanh lý',paid:'Đã thanh toán',pending:'Chờ thanh toán',info:'Lưu ý',tbc:'Chưa xác định ngày',dk:'Dự kiến'};
const badge=k=>`<span class="badge b-${k}">${LBL[k]}</span>`;
const TYPES=['Dịch vụ nhân lực (Manpower)','Dịch vụ kỹ thuật','Dịch vụ bảo vệ','Dịch vụ vệ sinh','Mua sắm','Khác'];

/* ===== Dữ liệu ===== */
let S;
function blank(){return{v:2,vendors:[],contracts:[],payments:[],log:[],settings:{warn:30,horizon:90}}}
let saveSeq=0,savedSeq=0;
function save(){stamp();
  saveSeq++;if(DIR)setTimeout(syncNow,0);else toast('CHƯA mở file dữ liệu — thay đổi này chưa được lưu vào file!','err')}
function toast(msg,kind){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.textContent=msg;t.className='show '+(kind||'ok');clearTimeout(t._h);t._h=setTimeout(()=>t.className='',kind==='err'?8000:2600)}

/* ===== Ô nhập ngày cố định dd-mm-yyyy (tháng: mm-yyyy) =====
   Ô date/month gốc của trình duyệt hiện theo ngôn ngữ máy (có máy ra mm/dd/yyyy → dễ nhập nhầm ngày/tháng).
   Giữ ô gốc (ẩn) để code đọc/ghi .value dạng ISO yyyy-mm-dd như cũ; thêm ô chữ dd-mm-yyyy + nút 📅 mở lịch. */
const DMY={
  show:(v,m)=>{if(!v)return'';const p=v.split('-');return m?`${p[1]}-${p[0]}`:`${p[2]}-${p[1]}-${p[0]}`},
  read(s,m){s=s.trim();if(!s)return'';let a=s.split(/\D+/).filter(Boolean);
    if(a.length===1){const x=a[0];a=m?(x.length===6?[x.slice(0,2),x.slice(2)]:[]):(x.length===8||x.length===6?[x.slice(0,2),x.slice(2,4),x.slice(4)]:[])}
    if(a[0]&&a[0].length===4&&a.length===(m?2:3))a=a.slice(1).reverse().concat(a[0]);   // chấp nhận cả yyyy-mm-dd dán từ nơi khác
    const n=a.map(Number);if(n.length!==(m?2:3))return null;let y=n[n.length-1];if(y<100)y+=2000;if(y<1900||y>2200)return null;
    if(m)return n[0]>=1&&n[0]<=12?`${y}-${pad(n[0])}`:null;
    const t=new Date(y,n[1]-1,n[0]);return t.getFullYear()===y&&t.getMonth()===n[1]-1&&t.getDate()===n[0]?iso(t):null}
};
const DMY_P=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
function dmyOne(d){
  const m=d.type==='month';d.dataset.dmy=1;d.tabIndex=-1;
  const w=document.createElement('span');w.className='dmy';d.parentNode.insertBefore(w,d);
  const t=document.createElement('input');t.type='text';t.inputMode='numeric';t.autocomplete='off';t.placeholder=m?'mm-yyyy':'dd-mm-yyyy';t.maxLength=m?7:10;t.title='Nhập theo dạng '+t.placeholder+' (ví dụ '+(m?'11-2026':'21-11-2026')+')';
  const b=document.createElement('button');b.type='button';b.className='dmyb';b.tabIndex=-1;b.title='Chọn trên lịch';b.textContent='📅';
  w.append(t,b,d);
  const sync=()=>{t.value=DMY.show(DMY_P.get.call(d),m);t.classList.remove('bad')};
  Object.defineProperty(d,'value',{configurable:true,get(){return DMY_P.get.call(d)},set(v){DMY_P.set.call(d,v);sync()}});   // code gán .value → ô chữ tự cập nhật
  sync();d.addEventListener('change',sync);
  const commit=()=>{const v=DMY.read(t.value,m);
    if(v===null){t.classList.add('bad');toast(`Ngày "${t.value}" không hợp lệ — nhập theo dạng ${t.placeholder}. Đã trả lại giá trị cũ.`,'err');sync();return}
    if(v!==DMY_P.get.call(d)){DMY_P.set.call(d,v);d.dispatchEvent(new Event('input',{bubbles:true}));d.dispatchEvent(new Event('change',{bubbles:true}))}sync()};
  t.addEventListener('change',commit);
  t.addEventListener('keydown',e=>{if(e.key==='Enter')commit()});
  t.addEventListener('input',e=>{if(e.inputType==='insertText'&&(m?/^\d{2}$/:/^(\d{2}|\d{2}-\d{2})$/).test(t.value))t.value+='-'});   // tự thêm dấu "-" khi gõ số
  b.addEventListener('click',()=>{try{d.showPicker()}catch(_){t.focus()}});
}
function dmyEnhance(n){if(n.nodeType!==1)return;const q='input[type=date]:not([data-dmy]),input[type=month]:not([data-dmy])';if(n.matches(q))dmyOne(n);n.querySelectorAll(q).forEach(dmyOne)}
dmyEnhance(document.body);
new MutationObserver(ms=>ms.forEach(r=>r.addedNodes.forEach(dmyEnhance))).observe(document.body,{childList:true,subtree:true});
window.addEventListener('beforeunload',e=>{if(DIR&&saveSeq>savedSeq){e.preventDefault();e.returnValue=''}});
function log(action,text,detail){S.log.unshift({t:new Date().toISOString(),action,text,detail:detail||'',by:ME});S.log=S.log.slice(0,5000)}

/* ===== Dữ liệu dùng chung qua Google Drive =====
   Mọi thiết bị đăng nhập cùng tài khoản Google. Dữ liệu nằm trong file du-lieu-hop-dong.json (mã hóa) trên Drive.
   Mỗi bản ghi có dấu thời gian sửa cuối (u); khi 2 máy cùng sửa, hệ thống gộp theo từng bản ghi, bản sửa sau thắng. */
/*TEST-BEGIN (test-logic.html trích đoạn code giữa 2 mốc này để kiểm thử)*/
const DATAFILE='du-lieu-hop-dong.json',COLS=['vendors','contracts','payments'];
let DIR=null,PEND=null,SNAP={},syncing=false,syncPending=false,syncTimer=null,bkDone='',ME='',SYNC={state:'off',msg:'',time:''};
let LOADED=false;
const sig=r=>{const{u,by,...x}=r;return JSON.stringify(x)};
const setSig=()=>JSON.stringify([S.settings.warn,S.settings.horizon]);
let SNAPU={};
function snap(){SNAP={};SNAPU={};COLS.forEach(k=>S[k].forEach(r=>{SNAP[r.id]=sig(r);SNAPU[r.id]=r.u||0}));SNAP.__set=setSig()}
function stamp(){const now=Date.now(),seen={};S.tomb??={};
  COLS.forEach(k=>S[k].forEach(r=>{seen[r.id]=1;if(SNAP[r.id]!==sig(r)){r.u=Math.max(now,(r.u||0)+1);r.by=ME}}));
  Object.keys(SNAP).forEach(id=>{if(id!=='__set'&&!seen[id])S.tomb[id]=Math.max(now,(SNAPU[id]||0)+1)});
  if(SNAP.__set!==setSig())S.settings.u=Math.max(now,(S.settings.u||0)+1);snap()}
const TOMB_TTL=180*864e5;   // dấu xóa quá 180 ngày thì dọn (máy nào offline lâu hơn mức này mới có thể làm bản ghi đã xóa hiện lại)
function mergeData(a,b,now=Date.now()){
  const o={v:2,settings:(b.settings?.u||0)>(a.settings?.u||0)?b.settings:a.settings,tomb:{}};
  for(const t of[a.tomb||{},b.tomb||{}])for(const id in t)o.tomb[id]=Math.max(o.tomb[id]||0,t[id]);
  COLS.forEach(k=>{const m=new Map();for(const src of[a,b])(src[k]||[]).forEach(r=>{const e=m.get(r.id);if(!e||(r.u||0)>(e.u||0))m.set(r.id,r)});
    o[k]=[...m.values()].filter(r=>!(o.tomb[r.id]>=(r.u||0))).sort((x,y)=>x.id<y.id?-1:1)});
  for(const id in o.tomb)if(now-o.tomb[id]>TOMB_TTL)delete o.tomb[id];
  const cids=new Set(o.contracts.map(c=>c.id));o.payments=o.payments.filter(p=>cids.has(p.contractId));
  const seen=new Set();o.log=[...(a.log||[]),...(b.log||[])].filter(l=>{const k=l.t+l.action+l.text;if(seen.has(k))return false;seen.add(k);return true}).sort((x,y)=>y.t.localeCompare(x.t)).slice(0,5000);
  return o}

      const d=await readJson(h);if(!d||!d.contracts){if(name===DATAFILE)throw new Error('Chưa đọc được file dữ liệu trên Google Drive (mạng chập chờn hoặc file đang được ghi)');continue}
      if(name===DATAFILE){remote=d;remoteFh=h}else extras.push({name,d})}
    const before=canon(S);let M=S;if(remote)M=mergeData(M,remote);extras.forEach(x=>M=mergeData(M,x.d));
    if(M!==S){M.settings={...M.settings,lastBackup:S.settings.lastBackup};S=M;snap()}
    const after=canon(S);
    if(!remote||extras.length||FORCEW||canon(remote)!==after){
      if(remoteFh&&await remoteFh.changed()){syncPending=true;return}   // máy khác vừa ghi giữa lúc ta đọc và ghi → đọc lại, gộp lại rồi mới ghi (tránh đè mất thay đổi của máy kia)
      await writeJson(DIR,DATAFILE,S);FORCEW=false;for(const x of extras)try{await DIR.removeEntry(x.name)}catch(e){}}
    setTimeout(bkTick,300);
    LOADED=true;setSync('ok',extras.length?`Đã gộp ${extras.length} bản xung đột`:'');
    if(seq>savedSeq){savedSeq=seq;toast(`✓ Đã lưu vào cơ sở dữ liệu lúc ${new Date().toLocaleTimeString('vi-VN')}`)}
    if(after!==before&&!(dg&&dg.open))render();
  }catch(e){
    if(e.code==='NOAUTH'){setSync('ask',e.message);if(saveSeq>savedSeq)toast('⚠ Phiên Google hết hạn — bấm nút trên cùng để đăng nhập lại. Thay đổi CHƯA được lưu.','err');return}
    if(e.code==='NEEDPASS'||e.code==='BADPASS'){syncing=false;setTimeout(()=>lockApp(true,'Mật khẩu mã hóa đã đổi hoặc không khớp — nhập lại mật khẩu.'),0);return}
    setSync('err',e.message);if(saveSeq>savedSeq)toast('⚠ CHƯA lưu được vào file cơ sở dữ liệu ('+e.message+'). Đang thử lại — đừng đóng phần mềm.','err');setTimeout(()=>{if(DIR&&(saveSeq>savedSeq||!LOADED))syncNow()},5000)}
  finally{syncing=false;if(syncPending){syncPending=false;queueSync()}}
}

/* ===== Sao lưu: chọn thư mục + lịch tự động =====
   Thư mục sao lưu và lịch được nhớ trên máy này (IndexedDB), không nằm trong file dữ liệu.
   Chưa chọn thư mục → dùng thư mục con "SaoLuu" trong thư mục dữ liệu. */
const BK={every:1440,keep:0,last:'',hash:'',dir:null,pend:false,busy:false,warned:false};
const bkHash=()=>{const s=canon(S);let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return String(x)+':'+s.length};
const bkCfgSave=()=>idb('readwrite',s=>s.put({every:BK.every,keep:BK.keep,last:BK.last,hash:BK.hash},'bkcfg')).catch(()=>{});
async function bkLoad(){
  try{const c=await idb('readonly',s=>s.get('bkcfg'));if(c)Object.assign(BK,c)}catch(e){}
  try{const h=await idb('readonly',s=>s.get('bkdir'));if(h){BK.dir=h;BK.pend=(await h.queryPermission({mode:'readwrite'}))!=='granted'}}catch(e){}
}
async function bkTarget(){
  if(BK.dir){if(BK.pend)throw new Error('Chưa cấp quyền cho thư mục sao lưu — vào Cài đặt & Sao lưu để cấp lại');return BK.dir}
  if(!DIR)throw new Error('Chưa mở file dữ liệu');
  return DIR.getDirectoryHandle('SaoLuu',{create:true});
}
async function bkWrite(){
  const bd=await bkTarget(),d=new Date(),n=`saoluu-${today()}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.json`;
  await writeJson(bd,n,S);BK.last=d.toISOString();BK.hash=bkHash();await bkCfgSave();
  if(BK.keep>0){try{const L=[];for await(const[name,h]of bd.entries())if(h.kind==='file'&&/^saoluu-.*\.json$/i.test(name))L.push(name);L.sort();
    for(const old of L.slice(0,Math.max(0,L.length-BK.keep)))await bd.removeEntry(old)}catch(e){}}
  return{n,dir:bd.name};
}
async function bkTick(){
  if(!DIR||!LOADED||BK.busy||!(BK.every>0))return;
  if(BK.last&&Date.now()-new Date(BK.last).getTime()<BK.every*60000)return;
  if(BK.hash===bkHash())return;
  const dg=document.getElementById('dlg');if((dg&&dg.open)||syncing)return;
  if(BK.dir&&BK.pend){if(!BK.warned){BK.warned=true;toast('⚠ Sao lưu tự động đang dừng: cần cấp lại quyền thư mục sao lưu (Cài đặt & Sao lưu)','warn')}return}
  BK.busy=true;
  try{const r=await bkWrite();toast(`✓ Tự động sao lưu: ${r.dir}/${r.n}`);if(UI.page==='settings'&&!(dg&&dg.open))render()}
  catch(e){toast('⚠ Tự động sao lưu thất bại: '+e.message,'err')}
  finally{BK.busy=false}
}

/* Tài liệu đính kèm: lưu trên Google Drive (QuanLyHopDong/TaiLieu/<số HĐ>/...), dùng được trên mọi thiết bị.

/* Định dạng cho phép (không nhận .html/.svg/.js/.exe... vì file mở ra có thể chạy mã trong trang) */
const ATT_OK=['pdf','jpg','jpeg','png','gif','webp','heic','doc','docx','xls','xlsx','ppt','pptx','txt','csv','zip'];

const pickFiles=()=>new Promise(res=>{const i=document.createElement('input');i.type='file';i.multiple=true;i.accept=ATT_OK.map(e=>'.'+e).join(',');i.onchange=()=>res([...i.files]);i.oncancel=()=>res([]);i.click()});
async function attachFiles(cid,kind,aid){

      log('Đính kèm file',`${c.no}: ${n}`,`${KINDLBL[kind]} → Google Drive/TaiLieu/${sub}`)}

function posStart(c,p){return p.start||c.start}
function posEnd(c,p){return iso(new Date(addMonths(parse(posStart(c,p)),+p.months||0).getTime()-DAY))}
const psX=(c,p)=>isTbc(p)?'':posStart(c,p),peX=(c,p)=>isTbc(p)?'':posEnd(c,p);   // dùng khi xuất/hiển thị: chức danh chưa xác định thì để trống
const pStartHtml=(c,p)=>isTbc(p)?badge('tbc'):vn(posStart(c,p))+(p.st==='dk'?' '+badge('dk'):'');
function cEnd(c){if(c.end)return c.end;const e=c.positions.filter(p=>!isTbc(p)).map(p=>posEnd(c,p)).sort();return e.length?e[e.length-1]:c.start}
function cValue(c){return +c.value||c.positions.reduce((s,p)=>s+(+p.qty||0)*(+p.rate||0)*(+p.months||0),0)}
function cPaid(cid){return S.payments.filter(p=>p.contractId===cid&&p.payDate).reduce((s,p)=>s+(+p.amount||0),0)}
function cBilled(cid){return S.payments.filter(p=>p.contractId===cid).reduce((s,p)=>s+(+p.amount||0),0)}
function daysLeft(end){return Math.round((parse(end)-refD())/DAY)}
/* Thời gian còn lại dạng "x tháng y ngày" (tháng lịch, tính từ hôm nay đến ngày hết hạn; cùng mốc với daysLeft) */
function remTxt(end){const r=refD(),e=parse(end);if(e<r)return'';let m=0;while(addMonths(r,m+1)<=e)m++;const d=Math.round((e-addMonths(r,m))/DAY);return(m?m+' tháng':'')+(m&&d?' ':'')+(d||!m?d+' ngày':'')}
/* Sắp xếp chức danh theo mã trong hợp đồng (1, 2, … 10 theo số; không có mã thì giữ thứ tự nhập) */
const byCode=(a,b)=>!a.code||!b.code?(!a.code)-(!b.code):String(a.code).localeCompare(String(b.code),'vi',{numeric:true});
const todoList=c=>String(c.todo||'').split('\n').map(s=>s.trim()).filter(Boolean);
function cStatus(c){
  if(c.status==='draft')return'draft';if(c.status==='liq')return'liq';
  const r=refD();if(r<parse(c.start))return'wait';
  const l=daysLeft(cEnd(c));if(l<0)return'bad';if(l<=S.settings.warn)return'warn';return'ok';
}
function pStatus(c,p){if(isTbc(p))return'tbc';const r=refD();if(r<parse(posStart(c,p)))return'wait';const l=daysLeft(posEnd(c,p));if(l<0)return'bad';if(l<=S.settings.warn)return'warn';return'ok'}
const isActive=c=>['ok','warn'].includes(cStatus(c));

function genLines(c,ym){
  const[y,m]=ym.split('-').map(Number),ms=new Date(y,m-1,1),me=new Date(y,m,0),dim=me.getDate();
  return c.positions.map(p=>{const st=parse(posStart(c,p)),en=parse(posEnd(c,p));
    const a=st>ms?st:ms,b=en<me?en:me,days=isTbc(p)?0:b>=a?Math.round((b-a)/DAY)+1:0;   // chưa xác định ngày: không tính
    const l={posId:p.id,code:p.code||'',title:p.title,rate:+p.rate||0,qtyC:+p.qty||0,qty:days?+p.qty||0:0,daysMax:days,days,dim,end:iso(en)};if(c.pr)l.pr=c.pr;if(p.st)l.st=p.st;l.amount=lineAmt(l);return l});
}
/* Cách tính tháng lẻ (trường pr của hợp đồng, lưu kèm từng dòng thanh toán):
   ''   = theo ngày dương lịch: SL × Đơn giá × Ngày công ÷ Số ngày trong tháng (mặc định, như cũ)
   '365'= theo hợp đồng khung PVEP: Đơn giá ngày = Đơn giá tháng × 12 ÷ 365; Thành tiền = SL × (Đơn giá tháng − Đơn giá ngày × Số ngày không làm) */
const PR_OPTS=[['','Theo ngày dương lịch (ngày công ÷ số ngày trong tháng)'],['365','Theo năm 365 ngày (đơn giá tháng − đơn giá × 12/365 × ngày không làm)']];
const lineAmt=l=>{const q=+l.qty||0,r=+l.rate||0,d=+l.days||0,m=+l.dim||1;
  if(l.pr==='365'){if(d<=0)return 0;if(d>=m)return Math.round(q*r);return Math.round(q*Math.max(0,r-r*12/365*(m-d)))}
  return Math.round(q*r*d/m)};
const prText=pr=>pr==='365'?'Thành tiền = SL × (Đơn giá tháng − Đơn giá tháng × 12 ÷ 365 × Số ngày không làm trong tháng); làm đủ tháng = đơn giá tháng.':'Thành tiền = SL × Đơn giá × Ngày công ÷ Số ngày trong tháng.';
const lsum=L=>(L||[]).reduce((s,x)=>s+(+x.amount||0),0);   // cộng thành tiền các dòng chức danh hoặc chi phí hoàn trả

function field(f,val){
  const v=val??'';const id='f_'+f.k;let ctl;
  if(f.type==='select')ctl=`<select id="${id}">${f.opts.map(([o,l])=>`<option value="${esc(o)}" ${String(o)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else if(f.type==='textarea')ctl=`<textarea id="${id}" rows="2">${esc(v)}</textarea>`;
  else ctl=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}" ${f.type==='number'?'step="any" min="0"':''} placeholder="${esc(f.ph||'')}">`;
  return `<label class="${f.full?'full':''}${f.cls?' '+f.cls:''}">${esc(f.label)}${f.req?' <b style="color:#b91c1c">*</b>':''}${ctl}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</label>`;
}
function openForm(title,fields,data,onSave,wide){
  $('#dlg').className=wide?'wide':'';$('#dlgTitle').textContent=title;$('#dlgErr').textContent='';

  fields.filter(f=>f.money).forEach(f=>{const el=$('#f_'+f.k),h=document.createElement('span');h.className='hint';h.style.color='#1d4ed8';el.parentElement.appendChild(h);   // hiện số tiền có dấu chấm khi gõ
    const up=()=>{h.textContent=el.value!==''&&+el.value>=1000?'= '+fmt(el.value):''};el.addEventListener('input',up);up()});

  $('#dlgBody').innerHTML=`<p class="muted">Gõ mỗi chức danh một dòng; bấm Enter hoặc Tab để sang ô kế. Dòng để trống thì bỏ qua. "Ngày bắt đầu" để trống = theo ngày hiệu lực hợp đồng. Cột "Tình trạng ngày": chọn <b>Dự kiến</b> nếu ngày chỉ là ngày huy động dự kiến trong hợp đồng, <b>Chưa xác định</b> nếu hợp đồng chưa có ngày. Bấm "Hủy" nếu muốn nhập sau.</p>
    <div class="tbl"><table><thead><tr><th>Mã</th><th>Chức danh *</th><th>Số lượng *</th><th>Đơn giá / người / tháng *</th><th>Thời hạn (tháng) *</th><th>Ngày bắt đầu</th><th>Tình trạng ngày</th></tr></thead><tbody id="bpb">${bpRow().repeat(5)}</tbody></table></div>
    <button type="button" onclick="bpAdd(3)" style="margin-top:8px">+ Thêm 3 dòng</button>`;
  const tb=$('#bpb');
  tb.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const all=[...tb.querySelectorAll('input:not([data-dmy])')],i=all.indexOf(e.target);(all[i+1]||all[i]).focus()}});
  tb.addEventListener('input',e=>{if(e.target.dataset.k==='rate'){const h=e.target.nextElementSibling;h.textContent=+e.target.value>=1000?'= '+fmt(e.target.value):''}});
  dlgSave=()=>{const rows=[...tb.querySelectorAll('tr')].map(tr=>{const g=k=>tr.querySelector(`[data-k="${k}"]`).value.trim();return{code:g('code'),title:g('title'),qty:g('qty'),rate:g('rate'),months:g('months'),start:g('start'),st:g('st')}}).filter(r=>r.title||r.rate||r.months);
    if(!rows.length)return'Chưa có chức danh nào để thêm';
    for(let i=0;i<rows.length;i++){const r=rows[i],n=`Dòng ${i+1}${r.title?' ('+r.title+')':''}`;
      if(!r.title)return`${n}: thiếu chức danh`;if(!(+r.qty>0))return`${n}: số lượng phải lớn hơn 0`;if(!(+r.rate>0))return`${n}: thiếu đơn giá`;if(!(+r.months>0))return`${n}: thiếu thời hạn (tháng)`}
    rows.forEach(r=>c.positions.push({id:uid(),code:r.code,title:r.title,qty:+r.qty,rate:+r.rate,months:+r.months,start:r.st==='tbc'?'':r.start,...(r.st?{st:r.st}:{}),note:''}));
    log('Thêm chức danh',`${c.no}: thêm ${rows.length} chức danh (nhập nhiều)`,rows.map(r=>r.title+' — '+posSum(r)).join('; '))};
  $('#dlg').showModal();setTimeout(()=>{const f=tb.querySelector('input');if(f)f.focus()},50)}
/* Nhân bản (gia hạn): hợp đồng mới ở trạng thái Dự thảo, hiệu lực từ ngày sau khi HĐ cũ hết hạn, chép nhà thầu + chức danh (ngày bắt đầu chức danh để trống = theo ngày hiệu lực mới). Không chép phụ lục, file đính kèm, thanh toán, bảo lãnh, giá trị nhập tay. */
function dupContract(id){const c=contract(id);
  const d={...c,no:'',status:'draft',signDate:'',start:iso(new Date(parse(cEnd(c)).getTime()+DAY)),end:'',value:'',bondAmt:'',bondEnd:'',link:'',note:''};
  openForm('Nhân bản hợp đồng '+c.no+' (gia hạn / hợp đồng mới)',contractFields(),d,o0=>{
    const r=takeVendor(o0);if(r.err)return r.err;const o=r.o;
    if(S.contracts.some(x=>norm(x.no)===norm(o.no)))return'Số hợp đồng đã tồn tại';
    if(o.end&&o.end<o.start)return'Ngày hết hạn phải sau ngày hiệu lực';
    if(o.link&&!okLink(o.link))return LINKMSG;
    if(r.v){S.vendors.push(r.v);log('Thêm nhà thầu',`${r.v.code} - ${r.v.name} (thêm cùng hợp đồng)`)}
    const n={id:uid(),...o,positions:c.positions.map(p=>({id:uid(),code:p.code,title:p.title,qty:p.qty,rate:p.rate,months:p.months,start:'',...(p.st?{st:p.st}:{}),note:p.note||''})),amendments:[]};
    S.contracts.push(n);log('Nhân bản hợp đồng',`${o.no} (từ ${c.no}), chép ${n.positions.length} chức danh`);UI.page='contract';UI.id=n.id},1);
  vendorToggle()}
function delContract(id){const c=contract(id);const np=S.payments.filter(p=>p.contractId===id).length;
  if(!confirm(`Xóa hợp đồng ${c.no}${np?` cùng ${np} lần thanh toán`:''}? Không thể hoàn tác (trừ khi có file sao lưu).`))return;
  S.contracts=S.contracts.filter(x=>x.id!==id);S.payments=S.payments.filter(p=>p.contractId!==id);log('Xóa hợp đồng',c.no);save();UI.page='contracts';UI.id=null;render()}

const POS_F=[{k:'code',label:'Mã vị trí'},{k:'title',label:'Chức danh',req:1},{k:'qty',label:'Số lượng',type:'number',req:1},{k:'rate',money:1,label:'Đơn giá / người / tháng',type:'number',req:1},
  {k:'months',label:'Thời hạn (tháng)',type:'number',req:1},{k:'start',label:'Ngày bắt đầu',type:'date',hint:'Để trống = ngày hiệu lực HĐ'},
  {k:'st',label:'Tình trạng ngày bắt đầu',type:'select',opts:ST_OPTS,hint:'"Dự kiến": app nhắc cập nhật khi đến ngày. "Chưa xác định": chưa tính thanh toán/dự báo cho đến khi nhập ngày.'},{k:'note',label:'Ghi chú',full:1}];
function editPos(cid,pid){const c=contract(cid);const p=pid?c.positions.find(x=>x.id===pid):{qty:1};
  openForm(pid?'Sửa chức danh':'Thêm chức danh — '+c.no,POS_F,p,o=>{if(!(o.months>0))return'Thời hạn phải > 0';if(o.st==='tbc')o.start='';
    if(pid){Object.assign(p,o);log('Sửa chức danh',c.no+': '+o.title,DIFF)}else{c.positions.push({id:uid(),...o});log('Thêm chức danh',c.no+': '+o.title,posSum(o))}})}
const posSum=p=>`SL ${p.qty}; đơn giá ${fmt(p.rate)}; ${p.months} tháng${p.st==='tbc'?'; ngày bắt đầu chưa xác định':p.start?'; bắt đầu '+vn(p.start)+(p.st==='dk'?' (dự kiến)':''):''}`;
function delPos(cid,pid){const c=contract(cid),p=c.positions.find(x=>x.id===pid);if(confirm('Xóa chức danh '+p.title+'?')){c.positions=c.positions.filter(x=>x.id!==pid);log('Xóa chức danh',c.no+': '+p.title,'Đã xóa: '+posSum(p));save();render()}}

/* Loại văn bản: phụ lục (mặc định, dữ liệu cũ không có trường kind), lệnh giao việc (WRO) và lệnh thay đổi (CO) của hợp đồng khung */

function delAmd(cid,aid){const c=contract(cid),a=c.amendments.find(x=>x.id===aid);if(confirm('Xóa phụ lục '+a.no+'?')){c.amendments=c.amendments.filter(x=>x.id!==aid);log('Xóa phụ lục',c.no+': '+a.no);save();render()}}

/* ===== Ghi nhận thanh toán ===== */
let PAY=null;
function editPay(pid,cid,preset){
  const ex=pid?S.payments.find(p=>p.id===pid):null;
  const t=new Date();const defYm=`${t.getFullYear()}-${pad(t.getMonth()+1)}`;
  PAY=ex?JSON.parse(JSON.stringify(ex)):{id:null,contractId:cid||'',period:defYm,reqNo:'',invNo:'',payDate:'',note:'',lines:[],ex:[],...(preset||{})};PAY.ex=PAY.ex||[];
  if(!ex&&!preset&&PAY.contractId)PAY.lines=genLines(contract(PAY.contractId),PAY.period);
  $('#dlg').className='wide';$('#dlgTitle').textContent=pid?'Sửa ghi nhận thanh toán':'Ghi nhận thanh toán';$('#dlgErr').textContent='';
  const opts=S.contracts.filter(c=>c.status!=='draft').map(c=>`<option value="${c.id}" ${c.id===PAY.contractId?'selected':''}>${esc(c.no)} — ${esc(vendor(c.vendorId).name)}</option>`).join('');
  $('#dlgBody').innerHTML=`<div class="fgrid">
    <label>Hợp đồng *<select id="pC" ${pid?'disabled':''}><option value="">— Chọn hợp đồng —</option>${opts}</select></label>
    <label>Kỳ thanh toán (tháng) *<input type="month" id="pM" value="${PAY.period}"></label>
    <label>Số đề nghị thanh toán<input id="pR" value="${esc(PAY.reqNo)}"></label>
    <label>Số hóa đơn<input id="pI" value="${esc(PAY.invNo)}"></label>
    <label>Ngày thanh toán<input type="date" id="pD" value="${PAY.payDate}"><span class="hint">Để trống = đang chờ thanh toán</span></label>
    <label>Ghi chú<input id="pN" value="${esc(PAY.note)}"></label></div>
    <p class="muted" style="margin:12px 0 6px">Nhập <b>số người</b> và <b>số ngày công thực tế</b> theo bảng chấm công. <span id="pHelp"></span></p>
    <div class="tbl" id="pLines"></div><div id="pWarn"></div>`;
  const regen=()=>{const c=contract($('#pC').value);PAY.contractId=$('#pC').value;PAY.period=$('#pM').value;PAY.lines=c&&PAY.period?genLines(c,PAY.period):[];drawLines()};
  $('#pC').onchange=regen;$('#pM').onchange=()=>{if(!pid||confirm('Đổi kỳ sẽ tính lại các dòng theo hợp đồng. Tiếp tục?'))regen();else $('#pM').value=PAY.period};
  drawLines();
  dlgSave=()=>{
    if(!PAY.contractId)return'Chọn hợp đồng';if(!$('#pM').value)return'Chọn kỳ thanh toán';
    if(S.payments.some(p=>p.id!==pid&&p.contractId===PAY.contractId&&p.period===$('#pM').value)&&!confirm(`Hợp đồng này ĐÃ có ghi nhận thanh toán cho kỳ ${vnm($('#pM').value)}.\nVẫn lưu thêm một bản nữa (có thể bị trùng)?`))return'Chưa lưu: nghi trùng kỳ thanh toán. Hãy sửa bản đã có thay vì thêm mới.';
    const xs=PAY.ex.map(x=>({desc:String(x.desc||'').trim(),amount:Math.round(+x.amount||0)})).filter(x=>x.desc||x.amount);
    const bx=xs.find(x=>!x.desc||!(x.amount>0));if(bx)return'Chi phí hoàn trả: mỗi dòng cần có nội dung và số tiền lớn hơn 0';
    const o={contractId:PAY.contractId,period:$('#pM').value,reqNo:$('#pR').value.trim(),invNo:$('#pI').value.trim(),payDate:$('#pD').value,note:$('#pN').value.trim(),lines:PAY.lines,ex:xs,amount:lsum(PAY.lines)+lsum(xs)};
    const c=contract(o.contractId);
    if(pid){const ch=[['Số tiền',fmt(ex.amount),fmt(o.amount)],['Chi phí hoàn trả',fmt(lsum(ex.ex)),fmt(lsum(xs))],['Ngày thanh toán',vn(ex.payDate)||'(trống)',vn(o.payDate)||'(trống)'],['Số đề nghị',ex.reqNo||'(trống)',o.reqNo||'(trống)'],['Số hóa đơn',ex.invNo||'(trống)',o.invNo||'(trống)'],['Kỳ',vnm(ex.period),vnm(o.period)],['Ghi chú',ex.note||'(trống)',o.note||'(trống)']]
        .filter(x=>x[1]!==x[2]).map(x=>`${x[0]}: ${x[1]} → ${x[2]}`);
      ex.lines.forEach((l,i)=>{const n=o.lines[i];if(n&&(l.qty!==n.qty||l.days!==n.days))ch.push(`${l.title}: ${l.qty} người × ${l.days} ngày → ${n.qty} người × ${n.days} ngày`)});
      Object.assign(ex,o);log('Sửa thanh toán',`${c.no} kỳ ${vnm(o.period)}: ${fmt(o.amount)}`,ch.join('; '))}
    else{S.payments.push({id:uid(),...o});log('Ghi nhận thanh toán',`${c.no} kỳ ${vnm(o.period)}: ${fmt(o.amount)}`)}
  };
  $('#dlg').showModal();
}
function drawLines(){
  const c=contract(PAY.contractId);
  if(!c){$('#pLines').innerHTML='<p class="muted">Chọn hợp đồng để hiện các chức danh.</p>';$('#pWarn').innerHTML='';$('#pHelp').textContent='';return}
  $('#pHelp').textContent=prText(c.pr);
  const tot=lsum(PAY.lines);
  $('#pLines').innerHTML=`<table><thead><tr><th>Chức danh</th><th class="n">Đơn giá</th><th class="n">SL theo HĐ</th><th class="n">SL thực tế</th><th class="n">Ngày hiệu lực</th><th class="n">Ngày công TT</th><th class="n">Ngày/tháng</th><th class="n">Thành tiền</th></tr></thead><tbody>
  ${PAY.lines.map((l,i)=>`<tr${l.daysMax?'':' style="opacity:.55"'}><td>${esc(l.title)}${l.st==='tbc'?' '+badge('tbc'):l.daysMax?'':' <span class="badge b-bad">hết hạn / chưa bắt đầu</span>'}${l.st==='dk'?' <span class="badge b-dk">Ngày BĐ dự kiến</span>':''}</td><td class="n">${fmt(l.rate)}</td><td class="n">${l.qtyC}</td>
    <td class="n"><input class="cell" type="number" min="0" step="1" value="${l.qty}" data-i="${i}" data-k="qty"></td><td class="n">${l.daysMax}</td>
    <td class="n"><input class="cell" type="number" min="0" step="0.5" value="${l.days}" data-i="${i}" data-k="days"></td><td class="n">${l.dim}</td><td class="n"><b id="la${i}">${fmt(l.amount)}</b></td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="7">Cộng tiền nhân sự</td><td class="n" id="ptot">${fmt(tot)}</td></tr></tfoot></table>
  <p class="muted" style="margin:12px 0 6px"><b>Chi phí hoàn trả theo thực tế</b> (công tác phí, vé máy bay, khách sạn, visa, phụ cấp offshore...) — chỉ ghi khoản có hóa đơn gốc, không cộng phí quản lý.</p>
  <table><thead><tr><th>Nội dung</th><th class="n">Số tiền</th><th></th></tr></thead><tbody>
  ${PAY.ex.map((x,i)=>`<tr><td><input class="xc" data-i="${i}" data-k="desc" value="${esc(x.desc||'')}" placeholder="VD: Vé máy bay HCM–Hà Nội, Le Dinh Hung, 12/10" style="width:100%;min-width:260px"></td><td class="n"><input class="xc" type="number" min="0" step="any" data-i="${i}" data-k="amount" value="${x.amount??''}" style="width:150px"></td><td><button type="button" class="sm del" onclick="exDel(${i})">Xóa</button></td></tr>`).join('')||'<tr><td colspan="3" class="muted">Không có</td></tr>'}
  </tbody><tfoot><tr><td><button type="button" class="sm" onclick="exAdd()">+ Thêm chi phí hoàn trả</button></td><td class="n" id="xtot">${fmt(lsum(PAY.ex))}</td><td></td></tr>
  <tr><td><b>TỔNG KỲ NÀY</b></td><td class="n"><b id="gtot">${fmt(tot+lsum(PAY.ex))}</b></td><td></td></tr></tfoot></table>`;
  const upTot=()=>{$('#ptot').textContent=fmt(lsum(PAY.lines));$('#xtot').textContent=fmt(lsum(PAY.ex));$('#gtot').textContent=fmt(lsum(PAY.lines)+lsum(PAY.ex));payWarn()};
  $('#pLines').querySelectorAll('input.cell').forEach(inp=>inp.oninput=()=>{const l=PAY.lines[+inp.dataset.i];l[inp.dataset.k]=+inp.value||0;l.amount=lineAmt(l);
    $('#la'+inp.dataset.i).textContent=fmt(l.amount);upTot()});
  $('#pLines').querySelectorAll('input.xc').forEach(inp=>inp.oninput=()=>{const x=PAY.ex[+inp.dataset.i];x[inp.dataset.k]=inp.dataset.k==='amount'?(inp.value===''?'':+inp.value):inp.value;upTot()});
  payWarn();
}
function exAdd(){PAY.ex.push({desc:'',amount:''});drawLines();const L=$('#pLines').querySelectorAll('input.xc[data-k="desc"]');if(L.length)L[L.length-1].focus()}
function exDel(i){PAY.ex.splice(i,1);drawLines()}
function payWarn(){
  const c=contract(PAY.contractId);if(!c)return;const w=[];
  PAY.lines.forEach(l=>{if(l.qty>l.qtyC)w.push(`${l.title}: số người thực tế (${l.qty}) vượt số lượng trong HĐ (${l.qtyC}).`);
    if(l.days>l.daysMax)w.push(`${l.title}: ngày công (${l.days}) vượt số ngày còn hiệu lực trong tháng (${l.daysMax}) — có thể đã hết hạn.`)});
  const per=$('#pM').value;if(S.payments.some(p=>p.id!==PAY.id&&p.contractId===c.id&&p.period===per))w.push(`Hợp đồng đã có một lần ghi nhận thanh toán cho kỳ ${vnm(per)} — kiểm tra trùng lặp.`);
  const others=S.payments.filter(p=>p.id!==PAY.id&&p.contractId===c.id).reduce((s,p)=>s+p.amount,0),cur=lsum(PAY.lines)+lsum(PAY.ex),val=cValue(c);
  if(others+cur>val)w.push(`Tổng lũy kế (${fmt(others+cur)}) sẽ VƯỢT giá trị hợp đồng (${fmt(val)}).`);
  else if(val&&(others+cur)/val>=.9)w.push(`Lũy kế sau kỳ này đạt ${Math.round((others+cur)/val*100)}% giá trị hợp đồng.`);
  $('#pWarn').innerHTML=w.length?`<div class="warnbox">⚠ ${w.map(esc).join('<br>⚠ ')}</div>`:'';
}
function markPaid(id){const p=S.payments.find(x=>x.id===id);if(!p)return;const c=contract(p.contractId);
  if(!confirm(`Ghi nhận ĐÃ THANH TOÁN kỳ ${vnm(p.period)} của ${c?c.no:'?'} (${fmt(p.amount)}${cur(c)==='USD'?' USD':''}) vào ngày hôm nay ${vn(today())}?\n(Muốn ghi ngày khác: bấm Hủy rồi dùng nút Sửa.)`))return;
  p.payDate=today();log('Sửa thanh toán',`${c?c.no:'?'} kỳ ${vnm(p.period)}: ${fmt(p.amount)}`,`Ngày thanh toán: (trống) → ${vn(p.payDate)}`);save();render();toast('✓ Đã ghi nhận thanh toán')}
function delPay(id){const p=S.payments.find(x=>x.id===id);const c=contract(p.contractId);if(confirm(`Xóa thanh toán kỳ ${vnm(p.period)} của ${c?.no}?`)){S.payments=S.payments.filter(x=>x.id!==id);log('Xóa thanh toán',`${c?.no} kỳ ${vnm(p.period)}`,`Đã xóa: ${fmt(p.amount)}; số đề nghị ${p.reqNo||'—'}; hóa đơn ${p.invNo||'—'}`);save();render()}}

/* ===== Cảnh báo ===== */
function alerts(){
  const A=[],H=S.settings.horizon,W=S.settings.warn,thisYm=ymOf(refStr()),lastYm=prevYm(thisYm);
  const byNo={};S.contracts.forEach(c=>(byNo[norm(c.no)]??=[]).push(c));
  Object.values(byNo).filter(g=>g.length>1).forEach(g=>A.push({lvl:'bad',cid:g[0].id,t:`Số hợp đồng ${g[0].no} đang bị nhập TRÙNG ${g.length} lần (nhập trùng). Hãy giữ một bản và xóa bản còn lại.`}));
  for(const c of S.contracts){if(c.status==='draft'||c.status==='liq')continue;const st=cStatus(c),end=cEnd(c),l=daysLeft(end),vn_=vendor(c.vendorId).name;
    if(st==='bad')A.push({lvl:'bad',cid:c.id,t:`${c.no} (${vn_}) đã hết hạn ngày ${vn(end)} nhưng chưa thanh lý.`});
    else if(st!=='wait'&&l<=H)A.push({lvl:l<=W?'bad':l<=60?'warn':'info',cid:c.id,t:`${c.no} (${vn_}) hết hạn ngày ${vn(end)} — còn ${l} ngày. Chuẩn bị gia hạn hoặc lựa chọn nhà thầu mới.`});
    todoList(c).forEach(t=>A.push({lvl:'warn',cid:c.id,t:`${c.no}: cần bổ sung — ${t}`}));
    for(const p of c.positions){if(p.st==='tbc')A.push({lvl:'warn',cid:c.id,t:`${c.no}: chức danh "${p.title}" CHƯA CÓ NGÀY BẮT ĐẦU — chưa tính vào thanh toán/dự báo. Bổ sung ngày khi có thông báo huy động.`});
      else if(p.st==='dk'){const s=posStart(c,p);A.push(s<=refStr()?{lvl:'warn',cid:c.id,t:`${c.no}: chức danh "${p.title}" đã qua ngày bắt đầu DỰ KIẾN ${vn(s)} — cập nhật ngày bắt đầu thực tế.`}:{lvl:'info',cid:c.id,t:`${c.no}: chức danh "${p.title}" có ngày bắt đầu DỰ KIẾN ${vn(s)} — cập nhật khi có ngày thực tế.`})}}
    if(st!=='bad')for(const p of c.positions){if(isTbc(p))continue;const pe=posEnd(c,p),pl=daysLeft(pe);if(pe!==end&&pl>=0&&pl<=W)A.push({lvl:'warn',cid:c.id,t:`${c.no}: chức danh "${p.title}" hết hạn ngày ${vn(pe)} (còn ${pl} ngày) — dừng thanh toán sau ngày này.`})}
    if(c.bondEnd){const bl=daysLeft(c.bondEnd);
      if(bl<0&&st!=='bad')A.push({lvl:'bad',cid:c.id,t:`${c.no}: bảo lãnh thực hiện đã hết hạn ngày ${vn(c.bondEnd)} trong khi HĐ còn hiệu lực.`});
      else if(bl>=0&&bl<=W)A.push({lvl:'warn',cid:c.id,t:`${c.no}: bảo lãnh thực hiện hết hạn ngày ${vn(c.bondEnd)} (còn ${bl} ngày).`});
      else if(bl>=0&&c.bondEnd<end)A.push({lvl:'info',cid:c.id,t:`${c.no}: bảo lãnh hết hạn (${vn(c.bondEnd)}) TRƯỚC ngày hết hạn HĐ (${vn(end)}) — yêu cầu nhà thầu gia hạn bảo lãnh.`})}
    const val=cValue(c),b=cBilled(c.id),r=val?b/val:0;
    if(r>1)A.push({lvl:'bad',cid:c.id,t:`${c.no}: tổng đề nghị/thanh toán ${fmt(b)} VƯỢT giá trị HĐ ${fmt(val)}.`});
    else if(r>=.9)A.push({lvl:'warn',cid:c.id,t:`${c.no}: đã thanh toán/đề nghị ${Math.round(r*100)}% giá trị HĐ.`});
    else if(r>=.8)A.push({lvl:'info',cid:c.id,t:`${c.no}: đã thanh toán/đề nghị ${Math.round(r*100)}% giá trị HĐ.`});
    const activeLast=c.positions.some(p=>!isTbc(p)&&ymOf(posStart(c,p))<=lastYm&&ymOf(posEnd(c,p))>=lastYm);
    if(activeLast&&!S.payments.some(p=>p.contractId===c.id&&p.period===lastYm))A.push({lvl:'info',cid:c.id,t:`${c.no}: chưa ghi nhận thanh toán kỳ ${vnm(lastYm)}.`});
    const fl=c.files||[];
    if(!c.link&&!fl.some(f=>f.kind==='hd'))A.push({lvl:'info',cid:c.id,t:`${c.no}: chưa đính kèm file hợp đồng (bản scan).`});
    const noAmd=c.amendments.filter(a=>!a.link&&!fl.some(f=>f.aid===a.id));if(noAmd.length)A.push({lvl:'info',cid:c.id,t:`${c.no}: phụ lục ${noAmd.map(a=>a.no).join(', ')} chưa đính kèm file.`});
    const noDoc=S.payments.filter(p=>p.contractId===c.id&&!p.payDate&&!fl.some(f=>f.kind==='tt'&&filePeriod(f)===p.period));if(noDoc.length)A.push({lvl:'info',cid:c.id,t:`${c.no}: kỳ ${noDoc.map(p=>vnm(p.period)).join(', ')} đã đề nghị nhưng chưa đính kèm hồ sơ thanh toán.`});
    const pend=S.payments.filter(p=>p.contractId===c.id&&!p.payDate),pOld=pend.filter(p=>{const[py,pm]=p.period.split('-').map(Number);return(refD()-new Date(py,pm,0))/DAY>45}),pNew=pend.filter(p=>!pOld.includes(p));
    if(pOld.length)A.push({lvl:'warn',cid:c.id,t:`${c.no}: ${pOld.length} kỳ chờ thanh toán quá 45 ngày kể từ cuối kỳ (${pOld.map(p=>vnm(p.period)).join(', ')}) — đối chiếu và đôn đốc thanh toán.`});
    if(pNew.length)A.push({lvl:'info',cid:c.id,t:`${c.no}: có ${pNew.length} kỳ đã đề nghị nhưng chưa thanh toán (${pNew.map(p=>vnm(p.period)).join(', ')}).`});
  }
  const o={bad:0,warn:1,info:2};return A.sort((a,b)=>o[a.lvl]-o[b.lvl]);
}

/* Biểu đồ cột 12 tháng gần nhất: đã thanh toán (xanh) + chờ thanh toán (cam), chỉ tính VND */
function chartPay(ref){
  const ms=[],[y,m]=ref.split('-').map(Number);for(let i=11;i>=0;i--){const d=new Date(y,m-1-i,1);ms.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)}
  const D=ms.map(ym=>{let paid=0,pend=0;S.payments.forEach(p=>{if(p.period!==ym||cur(contract(p.contractId))==='USD')return;if(p.payDate)paid+=p.amount;else pend+=p.amount});return{ym,paid,pend}});
  const mx=Math.max(1,...D.map(x=>x.paid+x.pend)),W=720,H=200,pl=8,bw=40,gap=(W-pl*2-bw*12)/11,top=22,bot=H-30;
  const bars=D.map((x,i)=>{const px=pl+i*(bw+gap),hp=x.paid/mx*(bot-top),hq=x.pend/mx*(bot-top);
    return`<rect x="${px}" y="${bot-hp}" width="${bw}" height="${hp}" fill="#15803d"/><rect x="${px}" y="${bot-hp-hq}" width="${bw}" height="${hq}" fill="#d97706"/>${x.paid+x.pend?`<text x="${px+bw/2}" y="${bot-hp-hq-4}" text-anchor="middle" font-size="10" fill="#475569">${fmtM(x.paid+x.pend)}</text>`:''}<text x="${px+bw/2}" y="${H-12}" text-anchor="middle" font-size="11" fill="#475569">${x.ym.slice(5)}/${x.ym.slice(2,4)}</text>`}).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:240px" role="img" aria-label="Biểu đồ thanh toán 12 tháng gần nhất"><line x1="0" y1="${bot}" x2="${W}" y2="${bot}" stroke="#cbd5e1"/>${bars}</svg>`}
/* Dự báo 6 tháng: số tiền phát sinh theo hợp đồng (SL × đơn giá × ngày hiệu lực), bỏ qua kỳ đã ghi nhận thanh toán */
function forecast(){const t=refD(),out=[];
  for(let i=0;i<6;i++){const d=new Date(t.getFullYear(),t.getMonth()+i,1),ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;let n=0;const s={VND:0,USD:0};
    S.contracts.forEach(c=>{if(c.status==='draft'||c.status==='liq')return;if(S.payments.some(p=>p.contractId===c.id&&p.period===ym))return;
      const a=genLines(c,ym).reduce((q,l)=>q+l.amount,0);if(a>0){n++;s[cur(c)]+=a}});out.push({ym,n,s})}
  return out}

/* Tổng giá trị lệnh giao việc / lệnh thay đổi so với giá trị hợp đồng (mức trần ECV của hợp đồng khung) */
function amdFoot(c,val){const sm=k=>c.amendments.filter(a=>(a.kind||'pl')===k).reduce((s,a)=>s+(+a.value||0),0);const w=sm('wro'),co=sm('co');if(!w&&!co)return'';
  const r=val?w/val:0,col=r>1?'#991b1b':r>=.9?'#92400e':'';
  return`<tfoot>${w?`<tr><td colspan="3">Tổng giá trị lệnh giao việc</td><td class="n"${col?` style="color:${col}"`:''}>${fmt(w)}</td><td colspan="3">${val?`= ${Math.round(r*100)}% giá trị HĐ (${fmt(val)})${r>1?' — VƯỢT giá trị hợp đồng, cần lệnh thay đổi / phụ lục':''}`:''}</td></tr>`:''}${co?`<tr><td colspan="3">Tổng điều chỉnh theo lệnh thay đổi</td><td class="n">${fmt(co)}</td><td colspan="3" class="muted">Nhớ sửa "Giá trị hợp đồng" nếu lệnh thay đổi làm tăng/giảm giá trị.</td></tr>`:''}</tfoot>`}
function payTable(L,showC){
  let run=0;const tt={VND:0,USD:0};const body=L.map(p=>{const c=contract(p.contractId);tt[cur(c)]+=+p.amount||0;run+=p.amount;
    return `<tr><td><b>${vnm(p.period)}</b></td>${showC?`<td><a href="#" onclick="go('contract','${c.id}');return false">${esc(c.no)}</a></td><td>${esc(vendor(c.vendorId).name)}</td>`:''}<td>${esc(p.reqNo)}</td><td>${esc(p.invNo)}</td><td>${vn(p.payDate)}</td><td class="n"><b>${fmt(p.amount)}</b>${cur(c)==='USD'?' USD':''}${lsum(p.ex)?`<div class="muted" style="font-size:12px">gồm hoàn trả ${fmt(lsum(p.ex))}</div>`:''}</td>${showC?'':`<td class="n">${fmt(run)}</td>`}<td>${badge(p.payDate?'paid':'pending')}</td><td class="muted">${esc(p.note)}</td>
      <td>${p.payDate?'':`<button class="sm grn" onclick="markPaid('${p.id}')" title="Ghi nhận đã thanh toán hôm nay">✓ Đã trả</button> `}<button class="sm" onclick="editPay('${p.id}')">Sửa</button> <button class="sm del" onclick="delPay('${p.id}')">Xóa</button></td></tr>`}).join('');
  return `<div class="tbl"><table><thead><tr><th>Kỳ</th>${showC?'<th>Số HĐ</th><th>Nhà thầu</th>':''}<th>Số đề nghị</th><th>Số hóa đơn</th><th>Ngày TT</th><th class="n">Số tiền</th>${showC?'':'<th class="n">Lũy kế</th>'}<th>Trạng thái</th><th>Ghi chú</th><th></th></tr></thead>
  <tbody>${body||`<tr><td colspan="${showC?10:10}" class="muted">Chưa có thanh toán</td></tr>`}</tbody><tfoot><tr><td colspan="${showC?6:5}">Tổng cộng</td><td class="n">${fmtCur(tt)}</td><td colspan="4"></td></tr></tfoot></table></div>`;
}

const XC={navy:'FF1E3A8A',head:'FF1E40AF',light:'FFEFF6FF',zebra:'FFF8FAFC',line:'FFB6C2D4',tot:'FFDBEAFE',
  st:{tbc:['FFFFEDD5','FFC2410C'],ok:['FFDCFCE7','FF15803D'],warn:['FFFEF3C7','FFB45309'],bad:['FFFEE2E2','FFB91C1C'],wait:['FFE0E7FF','FF3730A3'],draft:['FFF1F5F9','FF475569'],liq:['FFEDE9FE','FF6D28D9'],paid:['FFDCFCE7','FF15803D'],pending:['FFFEF3C7','FFB45309'],info:['FFE0F2FE','FF0369A1']}};
const xd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const xfill=a=>({type:'pattern',pattern:'solid',fgColor:{argb:a}});
const xthin={style:'thin',color:{argb:XC.line}},xbox={top:xthin,left:xthin,bottom:xthin,right:xthin};
/* sheet: {name,title,infos:[[k,v]],cols:[{h,w,t:'num'|'date'|'int'|'text',al}],rows:[[]],status:{col,keys:[]},muted:[bool],sum:[colIdx],sumLabel,notes:[],sign} */
async function buildXlsx(fname,sheets,cat='bc'){
  if(typeof ExcelJS==='undefined'){alert('Chưa tải được thư viện Excel. Kiểm tra kết nối internet rồi thử lại.');return}
  const wb=new ExcelJS.Workbook();wb.creator='Quản lý Hợp đồng';wb.created=new Date();
  for(const sh of sheets){
    const n=sh.cols.length,infos=sh.infos||[];
    const ws=wb.addWorksheet(sh.name.replace(/[\\/?*\[\]:]/g,'-').slice(0,31),{views:[{state:'frozen',ySplit:infos.length+3,showGridLines:false}]});
    ws.columns=sh.cols.map(c=>({width:c.w||14}));
    ws.mergeCells(1,1,1,n);const t=ws.getCell(1,1);t.value=sh.title;t.font={bold:true,size:15,color:{argb:'FFFFFFFF'}};t.fill=xfill(XC.navy);t.alignment={horizontal:'center',vertical:'middle'};ws.getRow(1).height=30;
    infos.forEach(([k,v],i)=>{const r=i+2;ws.mergeCells(r,1,r,2);ws.mergeCells(r,3,r,n);const a=ws.getCell(r,1),b=ws.getCell(r,3);a.value=k;b.value=v;a.font={bold:true,color:{argb:'FF334155'}};a.fill=b.fill=xfill(XC.light)});
    const h=infos.length+3,hr=ws.getRow(h);hr.values=sh.cols.map(c=>c.h);hr.height=34;
    hr.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill=xfill(XC.head);c.border=xbox;c.alignment={horizontal:'center',vertical:'middle',wrapText:true}});
    sh.rows.forEach((row,i)=>{const r=ws.getRow(h+1+i);r.height=19;
      sh.cols.forEach((col,j)=>{let v=row[j];const cell=r.getCell(j+1);
        if(col.t==='date')v=v?xd(v):null;else if(['num','int','pct'].includes(col.t))v=(v===''||v==null)?null:+v;
        cell.value=v;cell.border=xbox;cell.alignment={vertical:'middle',wrapText:!!col.wrap,horizontal:col.al||(col.t==='date'||col.t==='int'?'center':undefined)};
        if(col.t==='num')cell.numFmt='#,##0';if(col.t==='date')cell.numFmt='dd-mm-yyyy';if(col.t==='pct')cell.numFmt='0%';
        if(i%2)cell.fill=xfill(XC.zebra);if(col.b)cell.font={bold:true};
        if(sh.muted&&sh.muted[i])cell.font={italic:true,color:{argb:'FF94A3B8'}}});
      if(sh.status){const k=sh.status.keys[i],cell=r.getCell(sh.status.col+1);if(XC.st[k]){cell.fill=xfill(XC.st[k][0]);cell.font={bold:true,color:{argb:XC.st[k][1]}};cell.alignment={horizontal:'center',vertical:'middle'}}}
    });
    const e=h+sh.rows.length;
    if(sh.sum&&sh.rows.length){const tr=ws.getRow(e+1);tr.height=22;
      for(let j=1;j<=n;j++){const c=tr.getCell(j);c.fill=xfill(XC.tot);c.border=xbox;c.font={bold:true}}
      tr.getCell((sh.sumLabel??1)+1).value='TỔNG CỘNG';
      sh.sum.forEach(j=>{const L=ws.getColumn(j+1).letter,c=tr.getCell(j+1);c.value={formula:`SUBTOTAL(9,${L}${h+1}:${L}${e})`,result:sh.rows.reduce((s,r)=>s+(+r[j]||0),0)};c.numFmt=sh.cols[j].t==='int'?'0':'#,##0';if(sh.cols[j].t==='int')c.alignment={horizontal:'center'}})}
    if(sh.rows.length)ws.autoFilter={from:{row:h,column:1},to:{row:e,column:n}};
    let nr=e+(sh.sum?3:2);
    (sh.notes||[]).forEach(t=>{const c=ws.getCell(nr++,1);c.value=t;c.font={italic:true,size:9,color:{argb:'FF64748B'}}});
    if(sh.sign){nr+=1;const pos=[Math.max(1,Math.round(n*0.15)),Math.round(n*0.5),Math.max(2,n-1)];['NGƯỜI LẬP','KẾ TOÁN','NGƯỜI DUYỆT'].forEach((t,i)=>{
      const a=ws.getCell(nr,pos[i]);a.value=t;a.font={bold:true};a.alignment={horizontal:'center'};const b=ws.getCell(nr+1,pos[i]);b.value='(Ký, ghi rõ họ tên)';b.font={italic:true,size:9,color:{argb:'FF64748B'}};b.alignment={horizontal:'center'}})}
    ws.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:`${h}:${h}`,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.3,footer:.3}};
    ws.headerFooter={oddFooter:'&L&8Trang &P/&N&R&8Xuất ngày '+vn(today())};
  }
  const buf=await wb.xlsx.writeBuffer();
  await saveOut(buf,fname,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',cat);return buf;
}

function payLinesSheet(L,title,infos,name){
  const rows=[],muted=[],keys=[];let stt=0;
  L.forEach(p=>{const c=contract(p.contractId);p.lines.forEach(l=>{rows.push([++stt,c.no,vendor(c.vendorId).name,l.title,l.qtyC,l.qty,l.rate,l.days,l.dim,l.amount,p.reqNo,p.invNo,p.payDate,p.payDate?'Đã thanh toán':'Chờ thanh toán']);muted.push(!l.amount);keys.push(p.payDate?'paid':'pending')});
    (p.ex||[]).forEach(x=>{rows.push([++stt,c.no,vendor(c.vendorId).name,'Chi phí hoàn trả: '+x.desc,'','','','','',x.amount,p.reqNo,p.invNo,p.payDate,p.payDate?'Đã thanh toán':'Chờ thanh toán']);muted.push(false);keys.push(p.payDate?'paid':'pending')})});
  const has365=L.some(p=>p.lines.some(l=>l.pr==='365')),hasEx=L.some(p=>(p.ex||[]).length);
  return{name,title,infos,cols:[{h:'STT',w:6,t:'int'},{h:'Số HĐ',w:17},{h:'Nhà thầu',w:28},{h:'Chức danh',w:26},{h:'SL theo HĐ',w:9,t:'int'},{h:'SL thực tế',w:9,t:'int'},{h:'Đơn giá (VND)',w:15,t:'num'},{h:'Ngày công TT',w:10,t:'int'},{h:'Ngày/tháng',w:9,t:'int'},{h:'Thành tiền (VND)',w:17,t:'num',b:1},{h:'Số đề nghị',w:18},{h:'Số hóa đơn',w:12},{h:'Ngày TT',w:12,t:'date'},{h:'Trạng thái',w:15}],
    rows,muted,status:{col:13,keys},sum:[9],sumLabel:3,sign:true,notes:['Thành tiền = SL thực tế × Đơn giá × Ngày công thực tế ÷ Số ngày trong tháng.',...(has365?['Hợp đồng tính theo năm 365 ngày: Thành tiền = SL × (Đơn giá tháng − Đơn giá tháng × 12 ÷ 365 × Số ngày không làm).']:[]),...(hasEx?['Dòng "Chi phí hoàn trả" là chi phí thực tế có hóa đơn (công tác phí...), không theo đơn giá.']:[]),...(mixedCur()?[MIXNOTE]:[])]};
}

function rep2(){const N=+$('#r2d').value||90;const rows=[],keys=[];

function parseContractObj(d,pos,bad){
  const errors=[...bad],warns=[];const g=k=>d[k]==null?'':d[k];
  if(!g('no'))errors.push('Thiếu Số hợp đồng');if(!g('vname'))errors.push('Thiếu Tên nhà thầu');if(!g('start'))errors.push('Thiếu Ngày hiệu lực');

  if(g('end')&&g('start')&&d.end<d.start)errors.push('Ngày hết hạn trước ngày hiệu lực');
  if(g('type')){const t=norm(d.type);d.type=TYPES.find(x=>norm(x).includes(t)||t.includes(norm(x.split(' (')[0])))||'Khác'}
  if(g('currency'))d.currency=String(d.currency).toUpperCase()==='USD'?'USD':'VND';
  const P=pos.filter(p=>p.title||p.code).map((p,i)=>{const at=p._r?`dòng ${p._r}`:`chức danh ${i+1}`;const q={code:p.code||'',title:p.title||'',qty:toNum(p.qty),rate:toNum(p.rate),months:toNum(p.months),start:p.start===null?null:toDate(p.start??''),note:p.note||''};const pst=String(p.st||'').toLowerCase();if(pst==='dk'||pst==='tbc')q.st=pst;if(q.st==='tbc')q.start='';
    if(!q.title)errors.push(`${at}: thiếu tên chức danh`);if(!(q.qty>0))errors.push(`${at} (${q.title}): số lượng không hợp lệ`);if(!(q.rate>0))errors.push(`${at} (${q.title}): đơn giá không hợp lệ`);
    if(!(q.months>0))errors.push(`${at} (${q.title}): thời hạn (tháng) không hợp lệ`);if(q.start===null){errors.push(`${at} (${q.title}): ngày bắt đầu không hợp lệ`);q.start=''}
    if(q.start&&g('start')&&q.start<d.start)warns.push(`${q.title}: ngày bắt đầu (${vn(q.start)}) trước ngày hiệu lực hợp đồng`);return q});
  const exist=S.contracts.find(c=>norm(c.no)===norm(g('no')));
  const ven=(g('vtax')&&S.vendors.find(v=>v.tax&&v.tax===String(d.vtax)))||(g('vcode')&&S.vendors.find(v=>norm(v.code)===norm(d.vcode)))||S.vendors.find(v=>norm(v.name)===norm(g('vname')));
  if(!P.length&&!exist)warns.push('File không có chức danh nào — hợp đồng sẽ được tạo trống.');
  if(exist&&ven&&exist.vendorId!==ven.id)warns.push('Nhà thầu trong file khác nhà thầu đang gắn với hợp đồng này.');
  if(g('bondEnd')&&P.length&&g('start')){const tmp={start:d.start,positions:P,end:g('end')};if(d.bondEnd<cEnd(tmp))warns.push(`Bảo lãnh hết hạn (${vn(d.bondEnd)}) trước ngày hết hạn hợp đồng (${vn(cEnd(tmp))}).`)}
  if(g('link')&&!okLink(d.link))errors.push(LINKMSG);else if(!g('link'))warns.push('Chưa có đường dẫn file scan hợp đồng.');
  return{d,P,errors,warns,exist,ven};
}

    ${P.map(p=>{const ok=p.months>0&&d.start;const m=exist&&matchPos(exist,p);return`<tr><td>${esc(p.code)}</td><td><b>${esc(p.title)}</b></td><td class="n">${p.qty||''}</td><td class="n">${fmt(p.rate)}</td><td class="n">${p.months||''} th</td><td>${pStartHtml(c0,{...p,start:p.start||d.start})}</td><td><b>${isTbc(p)?'—':ok?vn(posEnd(c0,{...p,start:p.start||d.start})):'?'}</b></td><td>${exist?(m?'<span class="badge b-warn">Cập nhật</span>':'<span class="badge b-ok">Thêm mới</span>'):''}</td></tr>`}).join('')||'<tr><td colspan="8" class="muted">Không có chức danh</td></tr>'}</tbody></table></div>
    <div class="bar" style="margin-top:12px"><button class="pri" ${errors.length?'disabled style="opacity:.5"':''} onclick="applyContract()">✔ Xác nhận nhập vào hệ thống</button><button onclick="IMP=null;$('#impResult').innerHTML=''">Hủy</button>
    <span class="muted">Hãy đối chiếu nhanh với bản hợp đồng đã ký trước khi xác nhận.</span></div></div>`;
}
const matchPos=(c,p)=>c.positions.find(x=>(p.code&&norm(x.code)===norm(p.code))||(!p.code&&norm(x.title)===norm(p.title)));
function applyContract(){
  const{d,P,exist}=IMP;let v=IMP.ven;const g=k=>d[k]==null?'':d[k];
  if(!v){let n=S.vendors.length+1,code=g('vcode');while(!code||S.vendors.some(x=>norm(x.code)===norm(code)))code='NT-'+String(n++).padStart(3,'0');
    v={id:uid(),code,name:d.vname,tax:String(g('vtax')),addr:g('vaddr'),contact:g('vcontact'),phone:String(g('vphone')),email:g('vemail'),bank:g('vbank'),status:'active',rating:'',note:''};S.vendors.push(v);log('Thêm nhà thầu',`${v.code} - ${v.name} (nhập từ file)`)}
  else[['tax','vtax'],['addr','vaddr'],['contact','vcontact'],['phone','vphone'],['email','vemail'],['bank','vbank']].forEach(([k,s])=>{if(!v[k]&&g(s))v[k]=String(g(s))});
  let c=exist;if(!c){c={id:uid(),no:d.no,status:'signed',type:TYPES[0],currency:'VND',signDate:'',start:'',end:'',value:'',bondAmt:'',bondEnd:'',owner:'',dept:'',link:'',note:'',positions:[],amendments:[]};S.contracts.push(c)}
  if(g('pr')!=='')d.pr=String(d.pr)==='365'?'365':'';
  ['type','signDate','start','end','value','currency','pr','bondAmt','bondEnd','owner','dept','link','note','todo'].forEach(k=>{if(g(k)!=='')c[k]=d[k]});c.vendorId=v.id;
  let add=0,upd=0;P.forEach(p=>{const m=exist&&matchPos(c,p);if(m){Object.assign(m,{title:p.title,qty:p.qty,rate:p.rate,months:p.months,start:p.start,st:p.st||'',note:p.note||m.note});upd++}else{c.positions.push({id:uid(),...p});add++}});
  if(g('amdNo')&&!c.amendments.some(a=>norm(a.no)===norm(d.amdNo)))c.amendments.push({id:uid(),no:d.amdNo,date:g('amdDate'),content:g('amdContent')||'(nhập từ file)',link:g('link')});
  log(exist?'Cập nhật HĐ từ file':'Nhập HĐ từ file',`${c.no}: thêm ${add}, cập nhật ${upd} chức danh`);save();IMP=null;go('contract',c.id);
}

/* --- Nhập & đối chiếu hồ sơ thanh toán --- */
let IMPP=null;
function previewPay(o,rows,bad,fname){
  const box=$('#impResult'),fatal=[...bad];const c=S.contracts.find(x=>norm(x.no)===norm(o.no||''));const ym=o.period?toYm(o.period):null;
  if(!o.no)fatal.push('Thiếu Số hợp đồng');else if(!c)fatal.push(`Không tìm thấy hợp đồng "${o.no}" trong hệ thống — hãy nhập hợp đồng trước.`);
  if(!ym)fatal.push('Kỳ thanh toán không hợp lệ (cần dạng mm-yyyy)');
  if(fatal.length){box.innerHTML=`<div class="card"><h2>📄 ${esc(fname)}</h2><div class="errbox">• ${fatal.map(esc).join('<br>• ')}</div></div>`;return}
  const sys=genLines(c,ym),G=[],qsum={};
  const R=rows.filter(r=>(+r.qty||0)>0||(+r.days||0)>0||(+r.amtClaim||0)>0).map(r=>{
    const pos=c.positions.find(p=>r.code&&norm(p.code)===norm(r.code))||c.positions.find(p=>norm(p.title)===norm(r.title));const iss=[];
    const l=pos&&sys.find(x=>x.posId===pos.id);const qty=+r.qty||0,days=+r.days||0;
    if(Number.isNaN(r.qty)||Number.isNaN(r.days))iss.push('Số người / ngày công không phải là số');
    if(!pos)iss.push('Chức danh không có trong hợp đồng');
    else{qsum[pos.id]=(qsum[pos.id]||0)+qty;
      if(r.rateClaim!==''&&Math.abs(r.rateClaim-l.rate)>.5)iss.push(`Đơn giá ${fmt(r.rateClaim)} khác hợp đồng (${fmt(l.rate)})`);
      if(l.daysMax===0)iss.push(`Chức danh không còn hiệu lực trong kỳ (hết hạn ${vn(l.end)})`);
      else if(days>l.daysMax)iss.push(`Ngày công ${days} vượt số ngày còn hiệu lực (${l.daysMax}${l.daysMax<l.dim?', hết hạn '+vn(l.end):''})`);
      if(!(qty>0)||!(days>0))iss.push('Thiếu số người hoặc ngày công')}
    const sysAmt=l?lineAmt({qty,rate:l.rate,days:Math.min(days,l.daysMax),dim:l.dim,pr:l.pr}):0;
    if(pos&&r.amtClaim!==''&&!Number.isNaN(r.amtClaim)&&Math.abs(r.amtClaim-sysAmt)>1&&!iss.length)iss.push(`Thành tiền đề nghị ${fmt(r.amtClaim)} ≠ hệ thống tính ${fmt(sysAmt)}`);
    return{...r,qty,days,pos,l,sysAmt,iss}});
  R.forEach(r=>{if(r.pos&&qsum[r.pos.id]>r.l.qtyC)r.iss.push(`Tổng số người (${qsum[r.pos.id]}) vượt số lượng trong HĐ (${r.l.qtyC})`)});
  if(!R.length)G.push(['bad','File không có dòng nào được điền số người / ngày công.']);
  const st=cStatus(c);if(st==='draft')G.push(['bad','Hợp đồng đang ở trạng thái Dự thảo.']);if(st==='liq')G.push(['bad','Hợp đồng đã thanh lý.']);
  if(S.payments.some(p=>p.contractId===c.id&&p.period===ym))G.push(['bad',`Kỳ ${vnm(ym)} của hợp đồng này ĐÃ được ghi nhận thanh toán — nghi trùng hồ sơ.`]);
  const tot=R.reduce((s,r)=>s+r.sysAmt,0),claim=R.reduce((s,r)=>s+(+r.amtClaim||0),0),cum=cBilled(c.id)+tot,val=cValue(c);
  if(cum>val)G.push(['bad',`Lũy kế sau kỳ này (${fmt(cum)}) VƯỢT giá trị hợp đồng (${fmt(val)}).`]);else if(val&&cum/val>=.9)G.push(['warn',`Lũy kế sau kỳ này đạt ${Math.round(cum/val*100)}% giá trị hợp đồng.`]);
  if(!o.reqNo)G.push(['warn','Thiếu số đề nghị thanh toán.']);if(!o.invNo)G.push(['warn','Thiếu số hóa đơn.']);
  sys.filter(l=>l.daysMax>0&&!R.some(r=>r.pos&&r.pos.id===l.posId)).forEach(l=>G.push(['info',`Chức danh "${l.title}" còn hiệu lực trong kỳ nhưng không có trong bảng kê.`]));
  const nBad=R.filter(r=>r.iss.length).length+G.filter(g=>g[0]==='bad').length;
  IMPP={c,ym,o,R,G,tot,claim,nBad,fname};
  box.innerHTML=`<div class="card" style="border-color:${nBad?'#fca5a5':'#86efac'}"><div class="bar"><h2>🧾 Đối chiếu hồ sơ thanh toán: ${esc(c.no)} — kỳ ${vnm(ym)}</h2>
    <span class="badge ${nBad?'b-bad':'b-ok'}">${nBad?nBad+' điểm LỆCH':'KHỚP toàn bộ'}</span></div>
    <p class="muted">Nhà thầu: <b>${esc(vendor(c.vendorId).name)}</b> · Số đề nghị: <b>${esc(o.reqNo)||'—'}</b> · Hóa đơn: <b>${esc(o.invNo)||'—'}</b> · File: ${esc(fname)}</p>
    ${G.map(([k,t])=>`<div class="${k==='bad'?'errbox':k==='warn'?'warnbox':'okbox'}" ${k==='info'?'style="background:#f0f9ff;border-color:#7dd3fc;color:#075985"':''}>${k==='bad'?'✖':k==='warn'?'⚠':'ℹ'} ${esc(t)}</div>`).join('')}
    <div class="tbl"><table><thead><tr><th>Mã</th><th>Chức danh</th><th class="n">SL HĐ</th><th class="n">SL đề nghị</th><th class="n">Ngày hiệu lực</th><th class="n">Ngày công</th><th class="n">Đơn giá HĐ</th><th class="n">Nhà thầu đề nghị</th><th class="n">Hệ thống tính</th><th>Kết quả</th><th>Lý do</th></tr></thead><tbody>
    ${R.map(r=>`<tr><td>${esc(r.code)}</td><td><b>${esc(r.title)}</b></td><td class="n">${r.l?r.l.qtyC:''}</td><td class="n">${r.qty}</td><td class="n">${r.l?r.l.daysMax+'/'+r.l.dim:''}</td><td class="n">${r.days}</td><td class="n">${r.l?fmt(r.l.rate):''}</td><td class="n">${r.amtClaim===''?'':fmt(r.amtClaim)}</td><td class="n"><b>${fmt(r.sysAmt)}</b></td>
      <td>${r.iss.length?'<span class="badge b-bad">Lệch</span>':'<span class="badge b-ok">Khớp</span>'}</td><td style="white-space:normal;color:#991b1b">${r.iss.map(esc).join('; ')}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="7">Tổng cộng</td><td class="n">${fmt(claim)}</td><td class="n">${fmt(tot)}</td><td colspan="2">${Math.abs(claim-tot)>1?'Chênh lệch: '+fmt(claim-tot):''}</td></tr></tfoot></table></div>
    <div class="chk"><b>Kiểm tra hồ sơ giấy (bắt buộc tự xem):</b>
      <label><input type="checkbox" class="vchk"> Hóa đơn hợp lệ, đúng số tiền và thông tin đơn vị</label>
      <label><input type="checkbox" class="vchk"> Bảng chấm công có xác nhận của bộ phận sử dụng</label>
      <label><input type="checkbox" class="vchk"> Biên bản nghiệm thu / xác nhận khối lượng đầy đủ chữ ký</label>
      <label><input type="checkbox" class="vchk"> Đề nghị thanh toán có chữ ký, con dấu của nhà thầu</label></div>
    <div class="bar">${nBad?`<button class="pri" onclick="payDiscrepancy()">⬇ Xuất phiếu sai lệch (gửi trả nhà thầu)</button><button onclick="payManual()">Mở để chỉnh tay rồi ghi nhận</button>`
      :`<button class="pri" onclick="applyPay()">✔ Ghi nhận thanh toán (chờ thanh toán)</button><button onclick="payManual()">Mở để xem / chỉnh tay</button>`}
      <button onclick="IMPP=null;$('#impResult').innerHTML=''">Hủy</button></div></div>`;
}
function impLines(){return IMPP.R.filter(r=>r.pos).map(r=>{const l=r.l;const x={posId:l.posId,code:l.code,title:l.title,rate:l.rate,qtyC:l.qtyC,qty:r.qty,daysMax:l.daysMax,days:r.days,dim:l.dim,end:l.end};if(l.pr)x.pr=l.pr;x.amount=lineAmt(x);return x})}
function applyPay(){
  if([...document.querySelectorAll('.vchk')].some(x=>!x.checked))return alert('Hãy kiểm tra hồ sơ giấy và tích đủ 4 mục trước khi ghi nhận.');
  const{c,ym,o,fname}=IMPP,lines=impLines(),amount=lines.reduce((s,l)=>s+l.amount,0);
  S.payments.push({id:uid(),contractId:c.id,period:ym,reqNo:o.reqNo||'',invNo:o.invNo||'',payDate:'',lines,amount,note:(o.note?o.note+' · ':'')+'Nhập từ file, đối chiếu khớp, đã kiểm tra hồ sơ giấy'});
  log('Nhập thanh toán từ file',`${c.no} kỳ ${vnm(ym)}: ${fmt(amount)} (${fname})`);save();IMPP=null;go('contract',c.id);
}
function payManual(){const{c,ym,o}=IMPP;editPay(null,c.id,{contractId:c.id,period:ym,reqNo:o.reqNo||'',invNo:o.invNo||'',note:o.note||'',lines:impLines()})}
function payDiscrepancy(){const{c,ym,o,R,G,tot,claim}=IMPP;
  const sheet={name:'Sai lech',title:`PHIẾU ĐỐI CHIẾU HỒ SƠ THANH TOÁN — KỲ ${vnm(ym)}`,infos:[['Số hợp đồng:',c.no],['Nhà thầu:',vendor(c.vendorId).name],['Số đề nghị / hóa đơn:',`${o.reqNo||'—'} / ${o.invNo||'—'}`],['Kết quả:',`Đề nghị ${fmt(claim)} — Hệ thống tính ${fmt(tot)} — Chênh lệch ${fmt(claim-tot)}`]],
    cols:[{h:'Mã',w:9},{h:'Chức danh',w:28,b:1},{h:'SL theo HĐ',w:9,t:'int'},{h:'SL đề nghị',w:9,t:'int'},{h:'Ngày còn hiệu lực',w:10,t:'int'},{h:'Ngày công đề nghị',w:10,t:'int'},{h:'Đơn giá HĐ',w:15,t:'num'},{h:'Nhà thầu đề nghị',w:17,t:'num'},{h:'Hệ thống tính',w:17,t:'num'},{h:'Kết quả',w:10},{h:'Lý do sai lệch',w:60,wrap:1}],
    rows:R.map(r=>[r.code,r.title,r.l?r.l.qtyC:'',r.qty,r.l?r.l.daysMax:'',r.days,r.l?r.l.rate:'',r.amtClaim===''?'':r.amtClaim,r.sysAmt,r.iss.length?'Lệch':'Khớp',r.iss.join('; ')]),
    status:{col:9,keys:R.map(r=>r.iss.length?'bad':'ok')},sum:[7,8],sumLabel:1,
    notes:['Các vấn đề chung: '+(G.filter(g=>g[0]!=='info').map(g=>g[1]).join(' | ')||'không có'),'Đề nghị nhà thầu điều chỉnh và nộp lại bảng kê theo đúng mẫu.']};
  buildXlsx(`PhieuSaiLech_${c.no}_${ym}.xlsx`,[sheet],'mau');log('Xuất phiếu sai lệch',`${c.no} kỳ ${vnm(ym)}`);save()}

function vImport(){
  const t=new Date(),ym=`${t.getFullYear()}-${pad(t.getMonth()+1)}`;
  const cs=S.contracts.filter(c=>c.status!=='draft'&&c.status!=='liq');
  $('#view').innerHTML=`<div class="card"><h2>Nhập từ file</h2>
    <div class="drop" id="drop"><b>⬆ Kéo thả file vào đây, hoặc bấm để chọn file</b>Bảng kê đề nghị thanh toán nhà thầu gửi về (.xlsx) · File hợp đồng do Claude đọc từ bản scan (.json)<br><span class="muted">Hệ thống tự nhận biết loại file, cho xem trước và đối chiếu — chưa ghi gì cho đến khi bạn bấm xác nhận.</span></div>
    <input type="file" id="impFile" accept=".xlsx,.json,.pdf" hidden></div>
  <div id="impResult"></div>
  <div class="rep">
    <div class="card"><h2>Bảng kê đề nghị thanh toán (gửi nhà thầu)</h2><p>Gửi cho <b>nhà thầu</b> mỗi kỳ. File đã điền sẵn chức danh, đơn giá, số ngày còn hiệu lực — nhà thầu chỉ điền số người, ngày công, số hóa đơn.</p>
      <div class="bar"><select id="tc" style="max-width:100%">${cs.map(c=>`<option value="${c.id}">${esc(c.no)} — ${esc(vendor(c.vendorId).name)}</option>`).join('')}</select><input type="month" id="tm" value="${ym}"></div>
      <button class="grn" onclick="dlTplPay()">⬇ Tải bảng kê cho kỳ này</button></div>
    <div class="card"><h2>Quy trình 3 bước</h2><ol class="steps"><li><b>Nhận file</b> từ phòng Hợp đồng / nhà thầu (theo mẫu).</li><li><b>Kéo vào ô phía trên</b> → xem trước, đọc các điểm lệch.</li><li><b>Xác nhận</b> để ghi vào hệ thống, hoặc <b>xuất phiếu sai lệch</b> gửi trả.</li></ol>
      <p style="margin-top:8px">Chỉ có PDF/bản scan? Đưa file cho Claude và yêu cầu “tạo file nhập hợp đồng .json”, rồi kéo file .json vào đây.</p></div>
  </div>`;
  const d=$('#drop'),f=$('#impFile');d.onclick=()=>pickImport();f.onchange=()=>{if(f.files[0])handleFile(f.files[0]);f.value=''};
  d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])};
}
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
/* Dòng bảng / cảnh báo bấm được cũng thao tác được bằng bàn phím (Tab rồi Enter hoặc Space) */
const mkFocus=()=>document.querySelectorAll('#view tr.click:not([tabindex]),#view .alerts li:not([tabindex])').forEach(e=>{e.tabIndex=0;e.setAttribute('role','link')});
new MutationObserver(mkFocus).observe($('#view'),{childList:true,subtree:true});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const t=e.target.closest&&e.target.closest('tr.click,.alerts li');if(t&&e.target===t){e.preventDefault();t.click()}});
render();
initShare();
setInterval(()=>{if(DIR&&!document.hidden)syncNow()},20000);
window.addEventListener('focus',()=>{if(DIR)syncNow()});
</script>
